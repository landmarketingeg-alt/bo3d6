<style>
/* التخطيط: شريط علوي بهوية المكتب + محتوى بعرض 1180px، جداول قابلة للتمرير على الجوال */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#f7f8fb; --ink:#141b33; --muted:#5b6380; --line:#dde1ea;
  --navy:#0d1f6b; --navy-ink:#ffffff; --copper:#ac6121; --copper-soft:#f6ebe1;
  --ok:#1d7a45; --ok-soft:#e4f3ea; --warn:#9a6400; --warn-soft:#fbf1dc; --bad:#b3261e; --bad-soft:#fbe6e4; --info-soft:#e7ebf8;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,"Geeza Pro",sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Geeza Pro","Segoe UI",sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1222; --surface:#161b30; --surface2:#1b2139; --ink:#e7eaf5; --muted:#9aa2c0; --line:#2a3152;
  --navy:#7f97ff; --navy-ink:#0b1030; --copper:#e09a5c; --copper-soft:#3a2a1c;
  --ok:#5cc489; --ok-soft:#173326; --warn:#e3b04f; --warn-soft:#3a2f14; --bad:#f07b72; --bad-soft:#3d1c1b; --info-soft:#1f2748; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1222; --surface:#161b30; --surface2:#1b2139; --ink:#e7eaf5; --muted:#9aa2c0; --line:#2a3152;
  --navy:#7f97ff; --navy-ink:#0b1030; --copper:#e09a5c; --copper-soft:#3a2a1c;
  --ok:#5cc489; --ok-soft:#173326; --warn:#e3b04f; --warn-soft:#3a2f14; --bad:#f07b72; --bad-soft:#3d1c1b; --info-soft:#1f2748; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}
.n,.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.bad{color:var(--bad)} .okc{color:var(--ok)}

/* الشريط العلوي */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;object-fit:contain}
.brand b{font-family:var(--f-display);font-weight:600;font-size:16px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.user{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.user select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.role{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--copper-soft);color:var(--copper);font-weight:600}
nav.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
nav.tabs button.on{color:var(--navy);border-bottom-color:var(--copper)}

main{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:21px} h3{font-size:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);font-size:13px}
.crumbs{font-size:13px;color:var(--muted)} .crumbs a{cursor:pointer;text-decoration:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel>.head{align-items:center}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.kpi span{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi b{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--bad)}
.kpi.accent{border-top:3px solid var(--copper)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media (max-width:860px){.two{grid-template-columns:1fr}}

/* الأزرار */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.cop{background:var(--copper);border-color:var(--copper);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* الجداول */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--surface2);color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:left}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
tr.tot td{font-weight:700;background:var(--surface2)}
tr.rev td{color:var(--bad)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}

.p-approved,.p-paid{background:var(--ok-soft);color:var(--ok)}

.note{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.note.info{background:var(--info-soft);color:var(--navy)}
.acc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.acc{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);cursor:pointer;display:grid;gap:2px}
.acc span{font-size:12px;color:var(--muted)} .acc b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}

/* النماذج */

label.f input,label.f select,label.f textarea,.inp{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-weight:500;color:var(--ink);min-width:0}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label.f{min-width:140px;flex:1}

.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;border-top:1px solid var(--line);padding-top:12px}

.test li{margin:3px 0} .test .pass{color:var(--ok)} .test .fail{color:var(--bad);font-weight:700}
.logo-prev{width:120px;height:120px;object-fit:contain;border:1px dashed var(--line);border-radius:8px;background:#fff}

.v-amount i{font-style:normal;font-size:13px;opacity:.85}

.vl:last-child{border-bottom:0}

.v-grid>div:nth-child(3n+1){border-inline-start:0}
.v-grid span{font-size:11px;color:#5b6380;font-weight:600}

.v-cap{font-size:12px;font-weight:700;color:#3a4160;margin-bottom:-10px}

const ONES=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
const TEENS=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const HUND=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function w999(n){const h=Math.floor(n/100),r=n%100,p=[];if(h)p.push(HUND[h]);
  if(r){if(r<10)p.push(ONES[r]);else if(r<20)p.push(TEENS[r-10]);else{const o=r%10,t=Math.floor(r/10);p.push(o?ONES[o]+' و'+TENS[t]:TENS[t])}}return p.join(' و')}
function wScale(c,one,two,pl){if(c===1)return one;if(c===2)return two;const r=c%100,w=w999(c);if(r>=3&&r<=10)return w+' '+pl;return w+' '+one}
function numWords(n){n=Math.floor(n);if(n===0)return'صفر';const parts=[];
  const b=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),t=Math.floor(n%1e6/1e3),u=n%1e3;
  if(b)parts.push(wScale(b,'مليار','ملياران','مليارات'));if(m)parts.push(wScale(m,'مليون','مليونان','ملايين'));
  if(t)parts.push(wScale(t,'ألف','ألفان','آلاف'));if(u)parts.push(w999(u));return parts.join(' و')}
function tafqeet(a){a=r2(a);const i=Math.floor(a),h=Math.round((a-i)*100);
  let s=i?numWords(i)+' ريال سعودي':'';if(h)s+=(s?' و':'')+numWords(h)+' هللة';if(!s)s='صفر ريال';return'فقط '+s+' لا غير'}

async function hashPass(id,pw){const t=id+'|'+pw;
  try{if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return'h2:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=2166136261;for(const c of t){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return'h1:'+h.toString(16)}

function collectedMap(exId){const m={};for(const r of S.receipts){if(r.status!=='approved'||r.id===exId)continue;for(const a of r.allocations)m[a.instId]=r2((m[a.instId]||0)+a.amount)}return m}
const instCollected=(id,ex)=>collectedMap(ex)[id]||0;
const instRemaining=(i,ex)=>r2(i.amount-instCollected(i.id,ex));
const projInst=pid=>S.installments.filter(i=>i.projectId===pid).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
function instStatus(i,m){const c=(m||collectedMap())[i.id]||0,rem=r2(i.amount-c);
  if(rem<=0)return['paid','مسددة'];if(i.due&&i.due<today())return['late',c>0?'متأخرة (جزئي)':'متأخرة'];if(c>0)return['partial','مسددة جزئيًا'];return['due','مستحقة']}
function projectStats(p){const m=collectedMap(),t=today();let col=0,od=0,sch=0;
  for(const i of projInst(p.id)){const c=m[i.id]||0;col+=c;sch+=i.amount;const rem=r2(i.amount-c);if(i.due&&i.due<t&&rem>0)od+=rem}
  const exp=S.payments.filter(x=>x.status==='approved'&&x.scope==='project'&&x.projectId===p.id).reduce((s,x)=>s+x.amount,0);
  const fee=feeOf(p);return{fee,scheduled:r2(sch),collected:r2(col),remaining:r2(fee-col),overdue:r2(od),expenses:r2(exp)}}
function accountBalance(id,upTo){const a=account(id);if(!a)return 0;let b=+a.opening||0;
  for(const r of S.receipts)if(r.status==='approved'&&r.accountId===id&&(!upTo||r.date<=upTo))b+=r.amount;
  for(const x of S.payments)if(x.status==='approved'&&x.accountId===id&&(!upTo||x.date<=upTo))b-=x.amount;return r2(b)}
function totals(){let rec=0,pay=0,rem=0,od=0;for(const r of S.receipts)if(r.status==='approved')rec+=r.amount;
  for(const x of S.payments)if(x.status==='approved')pay+=x.amount;for(const p of liveProjects()){const s=projectStats(p);rem+=s.remaining;od+=s.overdue}
  return{rec:r2(rec),pay:r2(pay),rem:r2(rem),od:r2(od)}}

function projectBlockers(pid){const b=[];
  const r=S.receipts.filter(x=>x.projectId===pid&&x.status!=='draft').length;if(r)b.push(r+' سند قبض معتمد/ملغى');
  const x=S.payments.filter(v=>v.projectId===pid&&v.status!=='draft').length;if(x)b.push(x+' سند صرف معتمد/ملغى');
  const i=S.invoices.filter(v=>v.projectId===pid).length;if(i)b.push(i+' فاتورة/إشعار ضريبي');return b}
function deleteProject(pid){need(can('delete'),NOPERM);const p=project(pid);need(p,'المشروع غير موجود');
  const b=projectBlockers(pid);need(!b.length,'لا يمكن حذف المشروع لأن عليه: '+b.join('، ')+'. المستندات المعتمدة لا تُحذف للحفاظ على سلامة الحسابات.');
  S.receipts=S.receipts.filter(x=>x.projectId!==pid);S.payments=S.payments.filter(x=>x.projectId!==pid);
  S.installments=S.installments.filter(i=>i.projectId!==pid);S.projects=S.projects.filter(x=>x.id!==pid);
  logA('حذف مشروع غير مستكمل',projLabel(p));save()}
function deleteClient(cid){need(can('delete'),NOPERM);const c=client(cid);need(c,'العميل غير موجود');
  const ps=S.projects.filter(p=>p.clientId===cid),b=[];ps.forEach(p=>projectBlockers(p.id).forEach(x=>b.push(projLabel(p)+': '+x)));
  if(S.invoices.some(i=>i.clientId===cid&&!ps.some(p=>p.id===i.projectId)))b.push('فواتير ضريبية');
  need(!b.length,'لا يمكن حذف العميل لوجود مستندات معتمدة: '+b.join('، '));
  ps.forEach(p=>deleteProject(p.id));S.clients=S.clients.filter(x=>x.id!==cid);logA('حذف عميل',c.name);save()}

function archiveClient(cid,reason){need(can('archive'),'إلغاء عميل عليه سندات يحتاج صلاحية من مدير النظام');const c=client(cid);need(c,'العميل غير موجود');
  if(c.archived)return c;need((reason||'').trim(),'اكتب سبب إلغاء العميل');reason=reason.trim();const D=clientDocs(cid);
  D.rA.forEach(r=>cancelVoucher('receipt',r.id,'إلغاء العميل: '+reason));D.xA.forEach(x=>cancelVoucher('payment',x.id,'إلغاء العميل: '+reason));

/* =================== الفواتير الضريبية =================== */
function calcInvoice(lines,inclusive,rate){rate=rate??vatRate();let sub=0,vat=0;
  const L=lines.map(l=>{const qty=num(l.qty)||1,price=num(l.price),gross=r2(qty*price);
    const net=inclusive?r2(gross/(1+rate)):gross,v=inclusive?r2(gross-net):r2(net*rate);sub+=net;vat+=v;
    return{desc:(l.desc||'').trim(),qty,price:inclusive?r2(price/(1+rate)):price,net,vat:v,total:r2(net+v)}});
  return{lines:L,subtotal:r2(sub),vat:r2(vat),total:r2(sub+vat)}}
function issueInvoice(d){need(can('invoice'),'إصدار الفواتير يحتاج صلاحية من مدير النظام');
  const st=S.settings;need(validVat(st.vatNo),'أدخل الرقم الضريبي للمكتب (15 رقمًا يبدأ وينتهي بـ 3) من الإعدادات قبل إصدار الفواتير');
  if(S.invoices.some(i=>i.id===d.id))return invoice(d.id);
  const c=client(d.clientId);need(c,'اختر العميل');const p=d.projectId?project(d.projectId):null;if(d.projectId)need(p&&p.clientId===c.id,'المشروع لا يخص هذا العميل');
  need(d.date,'أدخل تاريخ الفاتورة');const type=d.type==='standard'?'standard':'simplified';
  if(type==='standard'){need(validVat(digits(c.vatNo)),'الفاتورة الضريبية (للمنشآت) تحتاج الرقم الضريبي للعميل في بياناته');need((c.address||'').trim(),'الفاتورة الضريبية (للمنشآت) تحتاج عنوان العميل')}
  const lines=(d.lines||[]).filter(l=>(l.desc||'').trim()||num(l.price));need(lines.length,'أضف بندًا واحدًا على الأقل');
  lines.forEach((l,i)=>{need((l.desc||'').trim(),`اكتب وصف البند ${i+1}`);need(num(l.price)>0,`أدخل سعر البند ${i+1}`)});
  const calc=calcInvoice(lines,!!d.inclusive);
  if(d.dry)return calc;
  const inv={id:d.id,kind:'invoice',type,no:++S.seq.invoice,clientId:c.id,projectId:p?.id||null,date:d.date,supplyDate:d.supplyDate||d.date,rate:+st.vatRate,
    ...calc,notes:(d.notes||'').trim(),status:'issued',issuedAt:now(),createdBy:me().name,
    buyer:{name:c.name,vatNo:digits(c.vatNo),address:c.address||'',idNo:c.idNo||''},seller:{name:st.officeName,vatNo:st.vatNo,crNo:st.crNo,address:[st.address,st.city].filter(Boolean).join('، ')}};
  S.invoices.push(inv);logA('إصدار فاتورة ضريبية',docNo('invoice',inv.no)+' – '+c.name+' – '+fmtN(inv.total));save();return inv}
function creditInvoice(id,reason){need(can('invoice'),NOPERM);const inv=invoice(id);need(inv&&inv.kind==='invoice','الفاتورة غير موجودة');
  if(inv.status==='credited')return invoice(inv.creditId);need((reason||'').trim(),'اكتب سبب إصدار الإشعار الدائن');
  const cn={...JSON.parse(JSON.stringify(inv)),id:uid(),kind:'credit',no:++S.seq.credit,refId:inv.id,reason:reason.trim(),date:today(),supplyDate:inv.supplyDate,issuedAt:now(),createdBy:me().name,status:'issued'};
  S.invoices.push(cn);inv.status='credited';inv.creditId=cn.id;logA('إصدار إشعار دائن (إلغاء فاتورة)',docNo('credit',cn.no)+' عن '+docNo('invoice',inv.no)+' – '+cn.reason);save();return cn}
const invQR=v=>zatcaTLV(v.seller.name,v.seller.vatNo,v.issuedAt.slice(0,19)+'Z',v.total,v.vat);

function ledger(entries,from,to,opening){entries.sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||'').localeCompare(b.ts||''));

  let bal=open,td=0,tc=0;for(const e of rows){bal=r2(bal+e.debit-e.credit);e.bal=bal;td+=e.debit;tc+=e.credit}return{open,rows,td:r2(td),tc:r2(tc),close:bal}}
function receiptEntries(filter,asCredit){const E=[];for(const r of S.receipts){if(r.status==='draft'||!filter(r))continue;const p=project(r.projectId);

/* =================== القوائم المالية (مبسطة – أساس نقدي) =================== */
function statements(f,t){
  const R=S.receipts.filter(r=>r.status==='approved'),P=S.payments.filter(x=>x.status==='approved');
  const rIn=R.filter(r=>inRange(r.date,f,t)),pIn=P.filter(x=>inRange(x.date,f,t));
  const revenue=r2(rIn.reduce((s,r)=>s+r.amount-(r.vat||0),0)),outVat=r2(rIn.reduce((s,r)=>s+(r.vat||0),0));
  const byCat={};pIn.filter(x=>!NONOP.includes(x.category)).forEach(x=>byCat[x.category]=r2((byCat[x.category]||0)+x.amount-(x.vat||0)));
  const expenses=r2(Object.values(byCat).reduce((s,v)=>s+v,0)),net=r2(revenue-expenses);
  const sumCat=(xs,c)=>r2(xs.filter(x=>x.category===c).reduce((s,x)=>s+x.amount,0));
  const inVat=r2(pIn.reduce((s,x)=>s+(x.vat||0),0)),vatPaid=sumCat(pIn,CAT_VAT),draw=sumCat(pIn,CAT_DRAW);
  // التدفقات النقدية
  const opening=r2(S.accounts.reduce((s,a)=>s+(f?accountBalance(a.id,prevDay(f)):(+a.opening||0)),0));
  const cashIn=r2(rIn.reduce((s,r)=>s+r.amount,0)),cashOut=r2(pIn.reduce((s,x)=>s+x.amount,0)),closing=r2(opening+cashIn-cashOut);
  const outByCat={};pIn.forEach(x=>outByCat[x.category]=r2((outByCat[x.category]||0)+x.amount));
  // المركز المالي في تاريخ النهاية
  const Rt=R.filter(r=>!t||r.date<=t),Pt=P.filter(x=>!t||x.date<=t);
  const accs=S.accounts.map(a=>[a.name,accountBalance(a.id,t)]),cash=r2(accs.reduce((s,a)=>s+a[1],0));
  const capital=r2(S.accounts.reduce((s,a)=>s+(+a.opening||0),0));
  const cumRev=r2(Rt.reduce((s,r)=>s+r.amount-(r.vat||0),0)),cumExp=r2(Pt.filter(x=>!NONOP.includes(x.category)).reduce((s,x)=>s+x.amount-(x.vat||0),0));
  const vatPayable=r2(Rt.reduce((s,r)=>s+(r.vat||0),0)-Pt.reduce((s,x)=>s+(x.vat||0),0)-sumCat(Pt,CAT_VAT));
  const cumDraw=sumCat(Pt,CAT_DRAW),retained=r2(cumRev-cumExp),equity=r2(capital+retained-cumDraw);
  const unbilled=r2(liveProjects().reduce((s,p)=>s+Math.max(0,projectStats(p).remaining),0));
  return{income:{revenue,outVat,byCat,expenses,net,inVat},cash:{opening,cashIn,cashOut,closing,outByCat,vatPaid,draw},
    pos:{accs,cash,vatPayable,capital,retained,cumDraw,equity,totalLE:r2(vatPayable+equity),balanced:Math.abs(cash-(vatPayable+equity))<0.01,unbilled}}}
function prevDay(d){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-1);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}
function statementsReport(f,t){const st=statements(f,t),I=st.income,C=st.cash,P=st.pos,per=(f||t)?` من ${f||'البداية'} إلى ${t||today()}`:' حتى '+today();

    {name:'قائمة الدخل',cols:['البند','المبلغ'],num:[1],rows:[['إيرادات الأتعاب الهندسية المحصّلة (صافي من الضريبة)',I.revenue],...Object.entries(I.byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>['مصروف: '+k,-v]),['إجمالي المصروفات التشغيلية',-I.expenses],['صافي الربح (الخسارة) للفترة',I.net]]},
    {name:'التدفقات النقدية',cols:['البند','المبلغ'],num:[1],rows:[['رصيد النقدية أول الفترة',C.opening],['المقبوضات من العملاء',C.cashIn],...Object.entries(C.outByCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>['مدفوع: '+k,-v]),['صافي التغير في النقدية',r2(C.cashIn-C.cashOut)],['رصيد النقدية آخر الفترة',C.closing]]},
    {name:'المركز المالي',cols:['البند','المبلغ'],num:[1],rows:[...P.accs.map(([n,b])=>['أصول متداولة – '+n,b]),['إجمالي الأصول',P.cash],['التزامات – ضريبة قيمة مضافة مستحقة (أساس نقدي)',P.vatPayable],['حقوق الملكية – رأس المال (الأرصدة الافتتاحية)',P.capital],['حقوق الملكية – أرباح متراكمة',P.retained],['حقوق الملكية – مسحوبات المالك',-P.cumDraw],['إجمالي الالتزامات وحقوق الملكية',P.totalLE],['للعلم: أتعاب متعاقد عليها لم تُحصّل بعد (غير مسجلة كأصل)',P.unbilled]]}]}}

/* =================== مولّد رمز QR (يعمل بدون إنترنت) =================== */
const QR=(()=>{
  const ECC_M=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK_M=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const rawMods=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dataCw=v=>Math.floor(rawMods(v)/8)-ECC_M[v]*BLK_M[v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  function divisor(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
  function remainder(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r}
  function alignPos(v){if(v===1)return[];const n=Math.floor(v/7)+2,step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2,res=[6];for(let p=v*4+10;res.length<n;p-=step)res.splice(1,0,p);return res}
  function encode(text){
    const bytes=[...new TextEncoder().encode(text)];let v=1;
    for(;v<=40;v++){const cc=v<10?8:16;if(4+cc+bytes.length*8<=dataCw(v)*8)break}
    if(v>40)throw new Error('بيانات QR طويلة جدًا');
    const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataCw(v)*8;put(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
    const nb=BLK_M[v],ecl=ECC_M[v],raw=Math.floor(rawMods(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),dv=divisor(ecl),blocks=[];
    for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+shortLen-ecl+(i<nShort?0:1));k+=d.length;const e=remainder(d,dv);if(i<nShort)d.push(0);blocks.push(d.concat(e))}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-ecl||j>=nShort)cw.push(b[i])});
    const size=v*4+17,M=[...Array(size)].map(()=>Array(size).fill(false)),F=[...Array(size)].map(()=>Array(size).fill(false));
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)setF(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const ap=alignPos(v),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const drawFormat=mask=>{const data=(0<<3)|mask;let r=data;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((data<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
      for(let i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));for(let i=9;i<15;i++)setF(14-i,8,g(i));
      for(let i=0;i<8;i++)setF(size-1-i,8,g(i));for(let i=8;i<15;i++)setF(8,size-15+i,g(i));setF(8,size-8,true)};
    drawFormat(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;
      for(let i=0;i<18;i++){const bit=((b>>>i)&1)===1,a=size-11+i%3,c=Math.floor(i/3);setF(a,c,bit);setF(c,a,bit)}}
    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;
      for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;
        if(!F[y][x]&&i<cw.length*8){M[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)===1;i++}}}
    const cond=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&cond[m](x,y))M[y][x]=!M[y][x]};
    const penalty=()=>{let p=0,dark=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      for(const row of M)for(const c of row)if(c)dark++;p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){applyMask(m);drawFormat(m);const p=penalty();if(p<bp){bp=p;best=m}applyMask(m)}
    applyMask(best);drawFormat(best);return M}
  function svg(text,px){const M=encode(text),n=M.length,q=4,s=n+q*2;let d='';
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(M[y][x])d+=`M${x+q},${y+q}h1v1h-1z`;
    return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" width="${px||150}" height="${px||150}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
  return{encode,svg}})();
/* رمز QR للفاتورة حسب المرحلة الأولى للفوترة الإلكترونية: TLV ثم Base64 */
function zatcaTLV(seller,vatNo,iso,total,vat){const enc=new TextEncoder(),out=[];
  [[1,seller],[2,vatNo],[3,iso],[4,Number(total).toFixed(2)],[5,Number(vat).toFixed(2)]].forEach(([t,v])=>{const b=[...enc.encode(String(v))];out.push(t,b.length,...b)});
  let s='';out.forEach(b=>s+=String.fromCharCode(b));return btoa(s)}

function vActs(k,v,compact){const a=[`<button class="btn sm" data-act="preview" data-kind="${k}" data-id="${v.id}">${compact||!can('print')?'عرض':'معاينة / طباعة'}</button>`];
  if(v.status==='draft'){a.push(`<button class="btn sm" data-act="${k==='receipt'?'editReceipt':'editPayment'}" data-id="${v.id}">تعديل</button>`);
    if(can('approve'))a.push(`<button class="btn sm pri" data-act="approve" data-kind="${k}" data-id="${v.id}">اعتماد</button>`);
    if(!compact)a.push(`<button class="btn sm danger" data-act="delDraft" data-kind="${k}" data-id="${v.id}">حذف</button>`)}
  if(v.status==='approved'&&can('cancel')&&!compact)a.push(`<button class="btn sm danger" data-act="cancelForm" data-kind="${k}" data-id="${v.id}">إلغاء السند</button>`);
  return`<div class="acts">${a.join('')}</div>`}
function voucherTable(list){return tw('<th>النوع</th><th>الرقم</th><th>التاريخ</th><th>الطرف</th><th>البيان</th><th>الحساب</th><th class="n">المبلغ</th><th>الحالة</th><th></th>',
  list.map(([k,v])=>`<tr class="${v.status==='cancelled'?'rev':''}"><td>${k==='receipt'?'قبض':'صرف'}</td><td class="n">${esc(docNo(k,v.no))}</td><td class="n">${esc(v.date)}</td><td>${esc(k==='receipt'?(v.payer||client(v.clientId)?.name):v.beneficiary)}</td>
  <td>${esc(k==='receipt'?projLabel(project(v.projectId))+(v.collector?' · المحصّل: '+v.collector:''):v.category+(v.scope==='project'?' – '+(project(v.projectId)?.name||''):' – عام'))}${v.attachment?' 📎':''}</td><td>${esc(account(v.accountId)?.name)}</td><td class="n"><b>${fmtN(v.amount)}</b></td><td>${stPill(v.status)}</td><td>${vActs(k,v)}</td></tr>`).join(''),'لا توجد سندات')}
function invoiceTable(list){return tw('<th>الرقم</th><th>النوع</th><th>التاريخ</th><th>المشروع</th><th class="n">قبل الضريبة</th><th class="n">الضريبة</th><th class="n">الإجمالي</th><th>الحالة</th><th></th>',
  list.map(i=>`<tr class="${i.kind==='credit'?'rev':''}"><td class="n">${esc(docNo(i.kind,i.no))}</td><td>${i.kind==='credit'?'إشعار دائن':i.type==='standard'?'فاتورة ضريبية':'مبسطة'}</td><td class="n">${esc(i.date)}</td><td>${esc(projLabel(project(i.projectId)))}</td>
   <td class="n">${fmtN(i.subtotal)}</td><td class="n">${fmtN(i.vat)}</td><td class="n"><b>${fmtN(i.total)}</b></td><td>${i.kind==='credit'?pill('cancelled','عن '+esc(docNo('invoice',invoice(i.refId)?.no))):i.status==='credited'?pill('cancelled','أُلغيت بإشعار'):pill('approved','صادرة')}</td>
   <td><div class="acts"><button class="btn sm" data-act="invPreview" data-id="${i.id}">${can('print')?'معاينة / طباعة':'عرض'}</button>${i.kind==='invoice'&&i.status==='issued'&&can('invoice')?`<button class="btn sm danger" data-act="creditForm" data-id="${i.id}">إلغاء بإشعار دائن</button>`:''}</div></td></tr>`).join(''),'لا توجد فواتير')}

function vVouchers(){const f=NAV.f||{type:'all',status:'all',q:''};
  let list=[...S.receipts.map(v=>['receipt',v]),...S.payments.map(v=>['payment',v])];
  if(f.type!=='all')list=list.filter(([k])=>k===f.type);if(f.status!=='all')list=list.filter(([,v])=>v.status===f.status);
  if(f.q){const q=f.q.trim();list=list.filter(([k,v])=>[docNo(k,v.no),v.payer,v.beneficiary,v.collector,client(v.clientId)?.name,client(v.clientId)?.phone,client(v.clientId)?.idNo,project(v.projectId)?.name,v.category,v.ref,v.purpose].join(' ').includes(q))}
  list.sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||'')||(b[1].createdAt||'').localeCompare(a[1].createdAt||''));
  return`<div class="head"><h2>السندات</h2><div class="acts"><button class="btn pri" data-act="newReceiptPick">سند قبض</button><button class="btn cop" data-act="newPayment">سند صرف</button></div></div>
  <div class="panel"><div class="filters">
   <label class="f">النوع<select id="vf_type" data-filter>${opts([['all','الكل'],['receipt','سندات القبض'],['payment','سندات الصرف']],f.type,x=>x[0],x=>x[1])}</select></label>
   <label class="f">الحالة<select id="vf_status" data-filter>${opts([['all','الكل'],['draft','مسودة'],['approved','معتمد'],['cancelled','ملغى']],f.status,x=>x[0],x=>x[1])}</select></label>
   <label class="f">بحث<input id="vf_q" data-filter value="${esc(f.q)}" placeholder="رقم سند، عميل، هاتف، هوية، محصّل، مرجع…"></label></div>
   ${voucherTable(list)}</div>`}

   (rep.flat||[]).map(s=>`<div class="grid"><h3>${esc(s.name)}</h3>${tw(s.cols.map((c,i)=>`<th class="${s.num.includes(i)?'n':''}">${c}</th>`).join(''),

const REPORTS=[['project','كشف حساب مشروع'],['client','كشف حساب عميل'],['account','كشف حساب مالي (خزينة/بنك)'],['expenses','تقرير المصروفات'],['collectors','التحصيل حسب المحصّل'],['invoices','سجل الفواتير الضريبية'],['vat','ملخص إقرار ضريبة القيمة المضافة'],['log','سجل العمليات']];
function vReports(){const R=NAV.r||(NAV.r={type:'project',id:S.projects[0]?.id,from:'',to:'',scope:'all'});
  const ents=R.type==='project'?S.projects.map(p=>[p.id,projLabel(p)+' – '+(client(p.clientId)?.name||'')]):R.type==='client'?S.clients.map(c=>[c.id,c.name]):R.type==='account'?S.accounts.map(a=>[a.id,a.name]):[];

   ${ents.length?`<label class="f">${R.type==='project'?'المشروع':R.type==='client'?'العميل':'الحساب'}<select id="rf_id" data-rep>${opts(ents,R.id,x=>x[0],x=>x[1])}</select></label>`:''}
   ${R.type==='expenses'?`<label class="f">النوع<select id="rf_scope" data-rep>${opts([['all','الكل'],['project','مصروفات مشاريع'],['general','مصروفات عامة']],R.scope,x=>x[0],x=>x[1])}</select></label>`:''}

function saveProjectFromForm(){const f=$('#pf'),id=f.dataset.id,ex=project(id);
  const d={clientId:$('#pf_client').value,no:$('#pf_no').value.trim(),name:$('#pf_name').value.trim(),service:$('#pf_service').value,feeInitial:num($('#pf_fee1').value),feeFinal:num($('#pf_fee2').value),contractDate:$('#pf_date').value,notes:$('#pf_notes').value.trim()};
  need(d.name,'اكتب اسم المشروع');need(d.service,'حدد نوع الخدمة');need(d.feeInitial>0||d.feeFinal>0,'أدخل أتعاب الاتفاق المبدئي أو النهائي');
  if(d.no)need(!S.projects.some(p=>p.no===d.no&&p.id!==id),'رقم المشروع مستخدم في مشروع آخر');
  if(ex&&ex.clientId!==d.clientId)need(!projectBlockers(id).length,'لا يمكن نقل مشروع عليه مستندات معتمدة إلى عميل آخر');
  const rows=$$('#instRows tr').map(tr=>({id:tr.dataset.inst,title:tr.querySelector('[data-k=title]').value.trim(),amount:num(tr.querySelector('[data-k=amount]').value),due:tr.querySelector('[data-k=due]').value}));
  need(rows.length,'أضف دفعة واحدة على الأقل في جدول الدفعات');
  rows.forEach((r,i)=>{need(r.title,`اكتب اسم الدفعة رقم ${i+1}`);need(r.amount>0,`أدخل مبلغ «${r.title}»`);need(r.due,`أدخل تاريخ استحقاق «${r.title}»`);
    const col=instCollected(r.id);need(r.amount>=col,`مبلغ «${r.title}» أقل من المحصّل منه (${fmtN(col)})`)});
  if(ex)for(const i of projInst(id))if(!rows.some(r=>r.id===i.id))need(!usedInst(i.id),`لا يمكن حذف «${i.title}» لوجود سندات عليه`);
  const p=ex||{id,createdAt:now(),createdBy:me().name};Object.assign(p,d);delete p.fee;if(!ex)S.projects.push(p);
  S.installments=S.installments.filter(i=>i.projectId!==id).concat(rows.map(r=>({...r,projectId:id})));
  logA(ex?'تعديل مشروع':'إنشاء مشروع',projLabel(p)+' – أتعاب '+fmtN(feeOf(p))+' (اتفاق '+feeStage(p)+')');save();closeModal();go('project',{id});
  const sum=r2(rows.reduce((a,r)=>a+r.amount,0));toast(sum===feeOf(p)?'تم حفظ المشروع':'تم الحفظ، لكن مجموع الدفعات لا يساوي الأتعاب',sum===feeOf(p)?'':'err')}

function readImage(file,maxW,type,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{if(!file.type.startsWith('image/'))return res(fr.result);const im=new Image();im.onload=()=>{const k=Math.min(1,maxW/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,q))};im.onerror=()=>res(fr.result);im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ---- المزامنة اللحظية ---- */
function stopSync(){UNSUB.forEach(f=>{try{f()}catch(e){}});UNSUB=[];READY=false}
function startSync(){R={settings:null,seq:null};COLLS.forEach(c=>R[c]=[]);
  return new Promise((res,rej)=>{const need_=new Set([...COLLS,'settings','seq']);
    const first=k=>{if(need_.delete(k)&&!need_.size){applyRemote(true);READY=true;res()}};
    for(const c of COLLS){const q=c==='log'?FB.query(FB.collection(DB,'log'),FB.orderBy('at','desc'),FB.limit(300)):FB.collection(DB,c);
      UNSUB.push(FB.onSnapshot(q,s=>{R[c]=s.docs.map(d=>({...d.data(),id:d.id}));onRemote();first(c)},e=>{rej(e);toast(fbErr(e),'err')}))}
    for(const k of['settings','seq'])UNSUB.push(FB.onSnapshot(dref('meta',k),d=>{R[k]=d.exists()?d.data():null;onRemote();first(k)},e=>{rej(e);toast(fbErr(e),'err')}))})}
function onRemote(){if(!READY)return;if(QUEUE.length||BUSY){REMOTE_DIRTY=true;return}applyRemote();scheduleRender()}
function applyRemote(){const cur=S.currentUserId;S=blankState();
  for(const c of COLLS)S[c]=clone(R[c]);S.log.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  S.settings=Object.assign(defaultSettings(),clone(R.settings)||{});S.seq=Object.assign({receipt:0,payment:0,invoice:0,credit:0},clone(R.seq)||{});
  S.currentUserId=cur||SESSION;L=snapshotOf(S);REMOTE_DIRTY=false;
  const u=S.users.find(x=>x.id===SESSION);if(SESSION&&(!u||u.active===false)){toast('تم إيقاف حسابك من مدير النظام','err');FB.signOut(AUTH)}}
function scheduleRender(){if(RENDER_PENDING)return;RENDER_PENDING=true;setTimeout(()=>{RENDER_PENDING=false;
  const a=document.activeElement;if(!$('#modal').hidden||(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){window.__renderLater=true;return}render()},120)}
function snapshotOf(st){const o={};for(const c of COLLS){o[c]=new Map();for(const x of st[c]||[])o[c].set(x.id,JSON.stringify(x))}
  o.settings=JSON.stringify(st.settings);o.seq=clone(st.seq);return o}

/* كل حفظ يُحسب كفرق عن آخر حالة مرسلة، ويُرسل في معاملة واحدة بالترتيب */
function cloudSave(){if(!READY||!L)return;const ops=[];
  for(const c of COLLS){const prev=L[c],seen=new Set();
    for(const x of S[c]){if(!x.id)x.id=uid();seen.add(x.id);const j=JSON.stringify(x);if(prev.get(x.id)!==j){ops.push({t:'set',c,id:x.id,data:JSON.parse(j)});prev.set(x.id,j)}}
    if(c!=='log')for(const id of[...prev.keys()])if(!seen.has(id)){ops.push({t:'del',c,id});prev.delete(id)}}
  const sj=JSON.stringify(S.settings);if(sj!==L.settings){ops.push({t:'set',c:'meta',id:'settings',data:JSON.parse(sj)});L.settings=sj}
  const seqChg={};for(const k of Object.keys(S.seq))if(S.seq[k]!==L.seq[k])seqChg[k]=L.seq[k]||0;
  if(Object.keys(seqChg).length){ops.push({t:'seq',expect:seqChg,data:clone(S.seq)});L.seq=clone(S.seq)}
  if(!ops.length)return;QUEUE.push(ops);flush()}
async function flush(){if(BUSY)return;BUSY=true;setSync(true);
  while(QUEUE.length){const ops=QUEUE[0];
    try{if(ops.length>400&&!ops.some(o=>o.t==='seq')){for(let i=0;i<ops.length;i+=400){const b=FB.writeBatch(DB);ops.slice(i,i+400).forEach(o=>o.t==='del'?b.delete(dref(o.c,o.id)):b.set(dref(o.c,o.id),o.data));await b.commit()}}
      else await FB.runTransaction(DB,async tx=>{const sq=ops.find(o=>o.t==='seq');
        if(sq){const s=await tx.get(dref('meta','seq')),cur=s.exists()?s.data():{};for(const[k,v]of Object.entries(sq.expect))if((cur[k]||0)!==v)throw{code:'seq-conflict'};tx.set(dref('meta','seq'),sq.data)}
        for(const o of ops){if(o.t==='set')tx.set(dref(o.c,o.id),o.data);else if(o.t==='del')tx.delete(dref(o.c,o.id))}});
      QUEUE.shift()}
    catch(e){QUEUE=[];if(e.code==='seq-conflict'){try{const q=await FB.getDoc(dref('meta','seq'));if(q.exists())R.seq=q.data()}catch(x){}}BUSY=false;setSync(false);applyRemote();render();
      toast(e.code==='seq-conflict'?'مستخدم آخر اعتمد سندًا في نفس اللحظة. تم تحديث الشاشة، أعد العملية':'لم يُحفظ آخر تعديل: '+fbErr(e),'err');return}}
  BUSY=false;setSync(false);if(REMOTE_DIRTY){applyRemote();scheduleRender()}}

addEventListener('beforeunload',e=>{if(CLOUD&&(BUSY||QUEUE.length)){e.preventDefault();e.returnValue=''}});
